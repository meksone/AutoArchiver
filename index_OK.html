<script>
  function updateButton(email, button) {
  var email = Session.getActiveUser().getEmail();
  button.value = "Archiver avviato da " + email;
  }
  </script>
  
<paper-header-panel mode="waterfall">
  <paper-toolbar><h1>Archiver v0.18</h1></paper-toolbar>
  <div>
  </div>
</paper-header-panel>



<template is="dom-bind">
<div class="middle">
<paper-tabs class="bottom self-end" selected="{{selected}}">
<paper-tab>Esegui</paper-tab>
<paper-tab>Imposta</paper-tab>
<paper-tab>Cancella</paper-tab>

    </paper-tabs>
  </div>
  <div class="bottom">
    <iron-pages selected="{{selected}}">
    <div> 
    <paper-button name="fireArchiver" id="fire-archiver" label="fire archiver" type="button" onclick="google.script.run
    .withSuccessHandler(updateButton)
    .withUserObject(this)
    .Archiver()" raised>Esegui Archiver Subito!</paper-button><br><br>
    
    <paper-button name="fireSendZips" id="fire-SendZips" label="fire SendZips" type="button" onclick="google.script.run
    .withSuccessHandler(updateButton)
    .withUserObject(this)
    .SendZipsOrLinks()" raised>Esegui SendZips Subito!</paper-button><br><br>
    </div>
    
    <div> 
    <paper-button name="settimer" id="settimer" label="set timer" type="button" onclick="google.script.run
    .withSuccessHandler(updateButton)
    .withUserObject(this)
    .setTriggerArchiver()" raised>Archiver ogni 5 minuti</paper-button><br><br>
    
    <paper-button name="settimerzips" id="settimerzips" label="set timer zips" type="button" onclick="google.script.run
    .withSuccessHandler(updateButton)
    .withUserObject(this)
    .setTriggerSendZips()" raised>SendZips ogni 5 minuti</paper-button><br><br>      
    </div>
    
    <div> 
    <paper-button name="deleteTriggers" id="del-triggers" label="delete triggers" type="button" onclick="google.script.run
    .withSuccessHandler(updateButton)
    .withUserObject(this)
    .delTrigger()" warning raised>Cancella tutti i Timer</paper-button><br><br>
    Quando si cancellano i Timer, ricordarsi di reimpostare almeno quello di Archiver
    </div>
    
    
    
     
      </iron-pages>
      </div>
      </template>
      
      <script>
      document.addEventListener('WebComponentsReady', function () {
      var template = document.querySelector('template[is="dom-bind"]');
      template.selected = 0; // selected is an index by default
      });
      </script>
